<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몽골 여행 상품 | EBA TOUR</title><meta name="description" content="EBA TOUR의 몽골 패키지 여행과 맞춤형 투어를 확인하세요. 고비사막, 테를지, 홉스골 등 몽골 여행 상담."><meta name="robots" content="index,follow"><link rel="canonical" href="https://eba-tour.com/tours.html">
<link rel="alternate" hreflang="ko" href="https://eba-tour.com/tours.html">
<link rel="alternate" hreflang="en" href="https://eba-tour.com/en/tours.html">
<link rel="alternate" hreflang="ja" href="https://eba-tour.com/ja/tours.html">
<link rel="alternate" hreflang="x-default" href="https://eba-tour.com/tours.html"><meta property="og:title" content="몽골 여행 상품 | EBA TOUR"><meta property="og:description" content="EBA TOUR와 함께 몽골 여행을 계획하세요."><style>body{font:16px Arial,sans-serif;margin:0;background:#f6f7f4;color:#1b2c25}header{background:#173d32;color:white;padding:22px 6%}main{max-width:1100px;margin:35px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:white;border-radius:14px;overflow:hidden;border:1px solid #e0e6e1}.card img{width:100%;height:190px;object-fit:cover}.body{padding:18px}.muted{color:#66736c}.btn{display:inline-block;background:#174b3b;color:white;padding:10px 14px;border-radius:8px;text-decoration:none}</style><meta property="og:url" content="https://eba-tour.com/tours.html"><meta property="og:type" content="website"></head><body><header><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><b>EBA TOUR · Discover Mongolia</b><select id="language" aria-label="Language" style="width:auto"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select></div></header><main><h1 id="pageTitle">몽골 여행 상품</h1><p class="muted" id="pageIntro">EBA TOUR와 함께 몽골의 특별한 여행을 계획해 보세요.</p><div id="tours" class="grid">투어를 불러오는 중…</div></main><script>
const P={gobi:"https://commons.wikimedia.org/wiki/Special:FilePath/Mongolian_Camel_in_Gobi_desert.jpg?width=1400",terelj:"https://commons.wikimedia.org/wiki/Special:FilePath/Turtle_Rock_Mongolia.jpg?width=1400",lake:"https://commons.wikimedia.org/wiki/Special:FilePath/Lake_Khuvsgul.jpg?width=1400",ub:"https://commons.wikimedia.org/wiki/Special:FilePath/Downtown_Ulaanbaatar.jpg?width=1400"};
const words={ja:{title:'モンゴルのツアー',intro:'公開中のツアーをご覧ください。ご希望に合わせた旅程もご相談いただけます。',days:'日間',price:'料金はお問い合わせください',enquire:'問い合わせる',empty:'ツアーは準備中です。オーダーメイド旅行についてお気軽にお問い合わせください。',error:'ツアーを読み込めませんでした。'},en:{title:'Our tours',intro:'Explore our published journeys. Send an enquiry to plan your trip.',days:'days',price:'Price on request',enquire:'Enquire',empty:'New tours will be published soon. Contact us to plan a custom trip.',error:'Tours are temporarily unavailable.'},ko:{title:'몽골 투어',intro:'현재 공개된 여행 상품을 확인하고 맞춤 일정을 문의해 주세요.',days:'일',price:'요금 문의',enquire:'문의하기',empty:'새로운 투어를 준비 중입니다. 맞춤 여행을 문의해 주세요.',error:'투어를 불러올 수 없습니다.'},mn:{title:'Монгол аяллууд',intro:'Нийтлэгдсэн аяллуудтай танилцаж, хүссэн аяллын хөтөлбөрөө захиалаарай.',days:'өдөр',price:'Үнийн мэдээлэл авах',enquire:'Хүсэлт илгээх',empty:'Шинэ аяллууд удахгүй нийтлэгдэнэ. Захиалгат аяллын талаар холбогдоорой.',error:'Аяллуудыг ачаалж чадсангүй.'}};
let lang=['ko','en','ja'].includes(localStorage.getItem('eba-lang'))?localStorage.getItem('eba-lang'):'ko';const sel=document.getElementById('language');sel.value=lang;function setLang(v){lang=v;localStorage.setItem('eba-lang',v);document.documentElement.lang=v;document.getElementById('pageTitle').textContent=words[v].title;document.getElementById('pageIntro').textContent=words[v].intro;load()}sel.addEventListener('change',e=>setLang(e.target.value));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function photoFor(t,i){const q=((t.slug||'')+' '+(t.title||'')+' '+(t.summary||'')).toLowerCase();if(/gobi|говь|ゴビ|고비/.test(q))return P.gobi;if(/terelj|тэрэлж|テレルジ|테를지/.test(q))return P.terelj;if(/khuvsgul|khövsgöl|хөвсгөл|フブスグル|홉스골/.test(q))return P.lake;if(/ulaanbaatar|улаанбаатар|ウランバートル|울란바토르/.test(q))return P.ub;return [P.gobi,P.terelj,P.lake,P.ub][i%4]}
async function load(){const root=document.getElementById('tours');try{const r=await fetch('/api/tours');const d=await r.json();root.innerHTML=(d.tours||[]).map((t,i)=>`<article class="card"><img src="${photoFor(t,i)}" alt="${esc(t.title)}"><div class="body"><h2>${esc(t.title)}</h2><p>${esc(t.summary)}</p><p class="muted">${esc(t.duration_days)} ${words[lang].days} · ${t.price_amount==null?words[lang].price:esc(t.price_currency)+' '+esc(t.price_amount)}</p><a class="btn" href="/?tour=${encodeURIComponent(t.slug)}#contact">${words[lang].enquire}</a></div></article>`).join('')||'<p>'+words[lang].empty+'</p>'}catch(e){root.textContent=words[lang].error}}
setLang(lang);
</script></body></html>
