<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EBA TOUR · Admin</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#18231f;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}header{background:#173d32;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1180px;margin:28px auto;padding:0 18px}.panel{background:white;border:1px solid #dfe6e1;border-radius:14px;padding:20px;margin:14px 0}.hidden{display:none!important}input,textarea,select{font:inherit;padding:11px;border:1px solid #cbd5cf;border-radius:8px;width:100%;margin:5px 0 12px}button{background:#174b3b;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:600}button.secondary{background:#e7eee9;color:#173d32}button.danger{background:#9b2929}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#e7eee9;color:#173d32}.tabs button.active{background:#174b3b;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;border-bottom:1px solid #e5eae6;padding:10px;vertical-align:top}th{background:#f5f8f6}.muted{color:#66736c;font-size:13px}.notice{padding:10px;background:#eef5ef;border-radius:8px;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:650px){table{display:block;overflow:auto}}
</style></head><body><header><strong>EBA TOUR · ADMIN</strong><div style="display:flex;gap:10px;align-items:center"><select id="adminLanguage" style="width:auto;margin:0"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select><button id="logout" class="secondary hidden">Sign out</button></div></header><main>
<section id="setup" class="panel hidden"><h2>Create first administrator</h2><p class="muted">Use the one-time BOOTSTRAP_SECRET configured in Cloudflare. After setup, remove that secret.</p><form id="setupForm"><label>Setup secret</label><input name="secret" type="password" required><label>Your name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password (minimum 12 characters)</label><input name="password" type="password" minlength="12" required><button>Create administrator</button></form><p id="setupMsg"></p></section>
<section id="login" class="panel hidden"><h2>Staff sign in</h2><form id="loginForm"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button>Sign in</button></form><p id="loginMsg"></p></section>
<section id="app" class="hidden"><div class="panel"><div class="row"><div><h2 id="welcome">Dashboard</h2><p class="muted">Manage tour content and incoming customer requests.</p></div><div id="role" class="muted"></div></div><nav class="tabs" id="tabs"></nav></div><div id="content" class="panel"></div></section>
</main><script>
const $=s=>document.querySelector(s);
const adminWords={ja:{setup:'最初の管理者を作成',setupNote:'Cloudflareに設定した一度限りのセットアップシークレットを使用してください。設定後、このシークレットを削除してください。',secret:'セットアップシークレット',name:'お名前',email:'メールアドレス',password:'パスワード（12文字以上）',create:'管理者を作成',login:'スタッフログイン',signin:'ログイン',signout:'ログアウト',welcome:'ようこそ',dashboard:'ツアー情報とお客様からのお問い合わせを管理します。',refresh:'更新',add:'追加',loading:'読み込み中…',records:'件のレコードを表示しています。顧客情報はログイン中のスタッフのみ閲覧できます。',action:'操作',save:'保存',edit:'編集',del:'削除',deactivate:'無効化',activate:'有効化',tourTitle:'ツアー名',summary:'概要',price:'料金',image:'画像URL',confirmDelete:'このレコードを削除しますか？',columns:{booking_code:'予約番号',customer_name:'お客様名',customer_email:'メール',start_date:'開始日',travellers:'人数',status:'状態',title:'ツアー名',slug:'URLスラッグ',duration_days:'日数',price_amount:'料金',price_currency:'通貨',tour_id:'ツアーID',end_date:'終了日',capacity:'定員',booked:'予約済み',name:'氏名',email:'メール',destination:'目的地',travel_date:'旅行日',country:'国',rating:'評価',content:'内容',image_url:'画像URL',caption:'キャプション',sort_order:'表示順',role:'権限',active:'有効'}},en:{setup:'Create first administrator',setupNote:'Use the one-time BOOTSTRAP_SECRET configured in Cloudflare. After setup, remove that secret.',secret:'Setup secret',name:'Your name',email:'Email',password:'Password (minimum 12 characters)',create:'Create administrator',login:'Staff sign in',signin:'Sign in',signout:'Sign out',welcome:'Welcome',dashboard:'Manage tour content and incoming customer requests.',refresh:'Refresh',add:'Add',loading:'Loading…',records:'records shown. Customer records are private to signed-in staff.',action:'Action',save:'Save',edit:'Edit',del:'Delete',deactivate:'Deactivate',activate:'Activate',tourTitle:'Tour title',summary:'Short summary',price:'Price amount',image:'Image URL',confirmDelete:'Delete this record?',columns:{}}};
adminWords.ko={setup:'첫 관리자 계정 만들기',setupNote:'Cloudflare에 설정한 1회용 BOOTSTRAP_SECRET을 입력하세요. 생성 후 해당 Secret을 삭제하세요.',secret:'설정 비밀키',name:'이름',email:'이메일',password:'비밀번호 (12자 이상)',create:'관리자 생성',login:'직원 로그인',signin:'로그인',signout:'로그아웃',welcome:'환영합니다',dashboard:'여행 상품과 고객 문의를 관리합니다.',refresh:'새로고침',add:'추가',loading:'불러오는 중…',records:'개 항목 표시 중. 고객 정보는 로그인한 직원만 볼 수 있습니다.',action:'작업',save:'저장',edit:'수정',del:'삭제',deactivate:'비활성화',activate:'활성화',tourTitle:'투어 이름',summary:'요약',price:'가격',image:'이미지 URL',confirmDelete:'이 항목을 삭제할까요?',columns:{booking_code:'예약 번호',customer_name:'고객 이름',customer_email:'이메일',start_date:'시작일',travellers:'인원',status:'상태',title:'투어 이름',slug:'URL 슬러그',duration_days:'일수',price_amount:'가격',price_currency:'통화',tour_id:'투어 ID',end_date:'종료일',capacity:'정원',booked:'예약 인원',name:'이름',email:'이메일',destination:'목적지',travel_date:'여행 날짜',country:'국가',rating:'평점',content:'내용',image_url:'이미지 URL',caption:'설명',sort_order:'정렬 순서',role:'권한',active:'활성화'}};let adminLang=['ko','en','ja'].includes(localStorage.getItem('eba-admin-lang'))?localStorage.getItem('eba-admin-lang'):'ko';function aw(k){return adminWords[adminLang][k]||k}function applyAdminLanguage(){document.documentElement.lang=adminLang;const map={'#setup h2':'setup','#setup .muted':'setupNote','#setupForm label:nth-of-type(1)':'secret','#setupForm label:nth-of-type(2)':'name','#setupForm label:nth-of-type(3)':'email','#setupForm label:nth-of-type(4)':'password','#setupForm button':'create','#login h2':'login','#loginForm label:nth-of-type(1)':'email','#loginForm label:nth-of-type(2)':'password','#loginForm button':'signin','#logout':'signout'};for(const [q,k] of Object.entries(map)){const el=$(q);if(el)el.textContent=aw(k)}const p=$('#app .panel .row .muted');if(p)p.textContent=aw('dashboard');if(staff&&$('#welcome'))$('#welcome').textContent=aw('welcome')+'、'+staff.name;}
const adminLanguage=$('#adminLanguage');adminLanguage.value=adminLang;adminLanguage.onchange=e=>{adminLang=e.target.value;localStorage.setItem('eba-admin-lang',adminLang);applyAdminLanguage();if(staff)showApp()};
const api=async(path,opts={})=>{const r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};let staff=null,active='bookings';const resources=['bookings','tours','availability','inquiries','reviews','gallery','staff'];
async function init(){applyAdminLanguage();try{const d=await api('auth/me');staff=d.staff;showApp()}catch{ $('#login').classList.remove('hidden'); $('#setup').classList.remove('hidden');applyAdminLanguage();}}
$('#setupForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{const d=await api('auth/bootstrap',{method:'POST',body:JSON.stringify(b)});$('#setupMsg').textContent=d.message;$('#setupForm').reset();}catch(x){$('#setupMsg').textContent=x.message}};
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});staff=d.staff;$('#loginMsg').textContent='';showApp()}catch(x){$('#loginMsg').textContent=x.message}};
$('#logout').onclick=async()=>{await api('auth/logout',{method:'POST'});location.reload()};
function showApp(){applyAdminLanguage();$('#setup').classList.add('hidden');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#logout').textContent=aw('signout');$('#welcome').textContent=aw('welcome')+(adminLang==='ja'?'、':', ')+staff.name;$('#role').textContent=staff.role;const list=staff.role==='super_admin'?resources:(staff.role==='manager'?resources.filter(x=>x!=='staff'):['bookings','inquiries']);$('#tabs').innerHTML=list.map(x=>`<button data-tab="${x}" class="${x===active?'active':''}">${adminLang==='ja'?({bookings:'予約',tours:'ツアー',availability:'空き状況',inquiries:'お問い合わせ',reviews:'レビュー',gallery:'ギャラリー',staff:'スタッフ'}[x]):x[0].toUpperCase()+x.slice(1)}</button>`).join('');$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){active=b.dataset.tab;showApp();load()}};load()}
const labels={bookings:['booking_code','customer_name','customer_email','start_date','travellers','status'],tours:['title','slug','duration_days','price_amount','price_currency','status'],availability:['tour_id','start_date','end_date','capacity','booked','status'],inquiries:['name','email','destination','travel_date','travellers','status'],reviews:['customer_name','country','rating','content','status'],gallery:['image_url','caption','sort_order','status'],staff:['name','email','role','active']};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const root=$('#content');root.innerHTML='<p>Loading…</p>';try{const d=await api('admin/'+active),rows=d[active]||[];let html=`<div class="row"><h2>${active}</h2><button id="refresh" class="secondary">${aw('refresh')}</button></div>`;
 if(['tours','availability','reviews','gallery','staff'].includes(active)&&staff.role!=='staff')html+=formFor(active);
 html+='<div style="overflow:auto"><table><thead><tr>'+labels[active].map(k=>`<th>${adminLang==='ja'?(adminWords.ja.columns[k]||k):k}</th>`).join('')+'<th>'+aw('action')+'</th></tr></thead><tbody>';
 html+=rows.map(r=>'<tr>'+labels[active].map(k=>`<td>${esc(r[k])}</td>`).join('')+`<td>${statusesFor(active).length?`<select data-status="${esc(r.id)}">${statusesFor(active).map(s=>`<option ${r.status===s?'selected':''}>${adminLang==='ja'?({new:'新規',contacted:'連絡済み',confirmed:'確定',cancelled:'キャンセル',completed:'完了',draft:'下書き',published:'公開',archived:'アーカイブ',open:'受付中',closed:'終了',pending:'保留',hidden:'非公開',spam:'迷惑メール'}[s]||s):s}</option>`).join('')}</select><button class="secondary" data-save="${esc(r.id)}">${aw('save')}</button>`:''}${active==='tours'&&staff.role!=='staff'?` <button class="secondary" data-edit="${esc(r.id)}">${aw('edit')}</button>`:''}${active==='staff'&&staff.role==='super_admin'?` <button class="secondary" data-active="${esc(r.id)}" data-value="${r.active?0:1}">${r.active?aw('deactivate'):aw('activate')}</button>`:''}${['tours','availability','reviews','gallery','inquiries'].includes(active)&&staff.role!=='staff'?` <button class="danger" data-delete="${esc(r.id)}">${adminLang==='ja'?'削除':'Delete'}</button>`:''}</td></tr>`).join('');
 html+='</tbody></table></div><p class="muted">'+rows.length+' '+(adminLang==='ja'?'件のレコードを表示しています。顧客情報はログイン中のスタッフのみ閲覧できます。':'records shown. Customer records are private to signed-in staff.')+'</p>';root.innerHTML=html;
 $('#refresh').onclick=load;root.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,status=root.querySelector(`[data-status="${id}"]`).value;try{await api('admin/'+active,{method:'PATCH',body:JSON.stringify({id,status})});load()}catch(e){alert(e.message)}});root.querySelectorAll('[data-active]').forEach(b=>b.onclick=async()=>{try{await api('admin/staff',{method:'PATCH',body:JSON.stringify({id:b.dataset.active,active:Number(b.dataset.value)})});load()}catch(e){alert(e.message)}});root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const row=rows.find(x=>x.id===b.dataset.edit);if(!row)return;const title=prompt(adminLang==='ja'?'ツアー名':'Tour title',row.title);if(title===null)return;const summary=prompt(adminLang==='ja'?'概要':'Short summary',row.summary||'');if(summary===null)return;const price=prompt(adminLang==='ja'?'料金（空欄の場合は要問い合わせ）':'Price amount (blank for quote)',row.price_amount??'');if(price===null)return;const image=prompt(adminLang==='ja'?'画像URL':'Image URL',row.image_url||'');if(image===null)return;try{await api('admin/tours',{method:'PATCH',body:JSON.stringify({id:row.id,title,summary,price_amount:price, image_url:image,slug:row.slug,description:row.description,duration_days:row.duration_days,price_currency:row.price_currency,status:row.status})});load()}catch(e){alert(e.message)}});root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm(aw('confirmDelete'))){try{await api('admin/'+active+'?id='+encodeURIComponent(b.dataset.delete),{method:'DELETE'});load()}catch(e){alert(e.message)}}});const form=$('#createForm');if(form)form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));try{await api('admin/'+active,{method:'POST',body:JSON.stringify(data)});form.reset();load()}catch(x){alert(x.message)}};
 }catch(e){root.innerHTML='<p>'+esc(e.message)+'</p>'}}
function statusesFor(r){return ({bookings:['new','contacted','confirmed','cancelled','completed'],tours:['draft','published','archived'],availability:['open','closed'],inquiries:['new','contacted','confirmed','closed','spam'],reviews:['pending','published','hidden'],gallery:['published','hidden']})[r]||[]}
function formFor(r){let fields={tours:['title','slug','summary','description','duration_days','price_amount','price_currency','image_url','status'],availability:['tour_id','start_date','end_date','capacity','price_amount','currency','status'],reviews:['customer_name','country','rating','content','status'],gallery:['image_url','caption','sort_order','status'],staff:['name','email','password','role']}[r];return `<form id="createForm" class="panel"><h3>${adminLang==='ja'?'新規追加：'+({tours:'ツアー',availability:'空き状況',reviews:'レビュー',gallery:'ギャラリー',staff:'スタッフ'}[r]||r):'Add '+r.slice(0,-1)}</h3><div class="grid">${fields.map(k=>`<label>${adminLang==='ja'?({title:'ツアー名',slug:'URLスラッグ',summary:'概要',description:'詳細説明',duration_days:'日数',price_amount:'料金',price_currency:'通貨',image_url:'画像URL',status:'状態',tour_id:'ツアーID',start_date:'開始日',end_date:'終了日',capacity:'定員',currency:'通貨',customer_name:'お客様名',country:'国',rating:'評価',content:'内容',caption:'キャプション',sort_order:'表示順',name:'氏名',email:'メール',password:'パスワード',role:'権限'}[k]||k):k}${['description','summary','content'].includes(k)?`<textarea name="${k}" ${k==='title'?'required':''}></textarea>`:k==='status'||k==='role'?`<select name="${k}">${(k==='status'?statusesFor(r):['staff','manager']).map(v=>`<option>${v}</option>`).join('')}</select>`:`<input name="${k}" ${['title','start_date','end_date','tour_id','image_url','customer_name','email','password'].includes(k)?'required':''} ${k==='password'?'type="password" minlength="12"':''} ${k==='email'?'type="email"':''}>`}</label>`).join('')}</div><button>${aw('add')}</button></form>`}
init();
</script></body></html>
